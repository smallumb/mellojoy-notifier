name = "mellojoy-notifier"
main = "src/entry.py"
compatibility_date = "2026-09-19"
# disable_python_external_sdk: `workers` モジュールを外部パッケージではなく
# ランタイム組み込みのものから読み込む（npx wrangler だけで動かすため）
compatibility_flags = ["python_workers", "disable_python_external_sdk"]

workers_dev = false
preview_urls = false

# 定期実行（cron）だけで動くため、公開URL（workers.dev）は使わない
# workers_dev = false
# Cron は UTC 基準（日本時間 = UTC + 9時間）
# 重複起動を避けるため、*/5 と重なる分（02:55, 03:00, 03:05, 03:10）は毎分側から除外
[triggers]
crons = [
  "*/5 * * * *",       # 通常時：5分ごと
  "56-59 2 * * *",     # 日本時間 11:56〜11:59：毎分（11:55 は */5 が担当）
  "1-4,6-9 3 * * *"    # 日本時間 12:01〜12:09：毎分（12:00/05/10 は */5 が担当）
]

[[d1_databases]]
binding = "DB"
database_name = "mellojoy-notifier"
database_id = "bdd1fd52-becb-4472-930e-83d9f774ce8f"

[observability]
enabled = true

